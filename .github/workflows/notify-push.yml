name: Send Push on New Audio

on:
  push:
    branches: [main]
    paths:
      - "*.mp3"
      - "index.html"

permissions:
  contents: read
  deployments: read

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect new MP3 files
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          ADDED=$(git diff --name-only --diff-filter=A HEAD~1 HEAD | grep '\.mp3$' || true)

          if [ -z "$ADDED" ]; then
            echo "No new MP3 files found."
            echo "has_files=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "New MP3 files found:"
          echo "$ADDED"

          {
            echo "files<<EOF"
            echo "$ADDED"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "has_files=true" >> "$GITHUB_OUTPUT"

      - name: Wait for GitHub Pages deployment
        if: steps.detect.outputs.has_files == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Waiting for GitHub Pages deployment for commit: $TARGET_SHA"
          echo "Repository: $REPO"

          DEPLOY_ID=""
          DEPLOY_STATUS=""

          for i in $(seq 1 90); do
            echo "Attempt $i/90"

            DEPLOYMENTS_JSON=$(curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/deployments?environment=github-pages&per_page=20")

            DEPLOY_ID=$(echo "$DEPLOYMENTS_JSON" | jq -r --arg SHA "$TARGET_SHA" '
              map(select(.sha == $SHA)) | first | .id // empty
            ')

            if [ -n "$DEPLOY_ID" ]; then
              echo "Found deployment ID: $DEPLOY_ID"

              STATUS_JSON=$(curl -fsSL \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${REPO}/deployments/${DEPLOY_ID}/statuses?per_page=10")

              DEPLOY_STATUS=$(echo "$STATUS_JSON" | jq -r '.[0].state // empty')
              echo "Deployment status: ${DEPLOY_STATUS:-none}"

              if [ "$DEPLOY_STATUS" = "success" ]; then
                echo "GitHub Pages deployment succeeded."
                exit 0
              fi

              if [ "$DEPLOY_STATUS" = "failure" ] || [ "$DEPLOY_STATUS" = "error" ]; then
                echo "Deployment failed with status: $DEPLOY_STATUS"
                exit 1
              fi
            else
              echo "No matching github-pages deployment found yet for this commit."
            fi

            sleep 10
          done

          echo "Timed out waiting for GitHub Pages deployment success."
          exit 1

      - name: Send push notifications
        if: steps.detect.outputs.has_files == 'true'
        env:
          FILES: ${{ steps.detect.outputs.files }}
          PUSH_FUNCTION_URL: ${{ secrets.PUSH_FUNCTION_URL }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${PUSH_FUNCTION_URL:-}" ]; then
            echo "Missing PUSH_FUNCTION_URL secret."
            exit 1
          fi

          while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue

            if echo "$FILE" | grep -q '\-isha'; then
              echo "Skipping isha file: $FILE"
              continue
            fi

            DATUM=$(basename "$FILE" .mp3)
            LIVE_URL="https://sverigesimamer.github.io/imam-schema-1448/${DATUM}.mp3"

            echo "Verifying live URL: $LIVE_URL"

            URL_OK=false
            for i in $(seq 1 24); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" --head "$LIVE_URL" || true)
              echo "  URL check $i/24 -> HTTP $STATUS"

              if [ "$STATUS" = "200" ]; then
                URL_OK=true
                break
              fi

              sleep 5
            done

            if [ "$URL_OK" != "true" ]; then
              echo "Live URL never returned 200 for $LIVE_URL"
              exit 1
            fi

            LINE=$(grep -oP "\{day:\d+.*?\}" index.html | grep "datum:'$DATUM'" || true)

            if [ -z "$LINE" ]; then
              echo "Datum $DATUM not found in SCHEDULE, using generic notification."
              TITLE="🔊 Låt Qur'anen fylla ditt hjärta"
              BODY="Kvällens Tarawih är nu uppladdad. Lyssna och reflektera över Allahs ord."
              URL="https://sverigesimamer.github.io/imam-schema-1448/"
            else
              NATT=$(echo "$LINE" | grep -oP "day:\K\d+" || true)
              IMAM=$(echo "$LINE" | grep -oP "imamLabel:'\K[^']+" || true)

              TITLE="🔊 Låt Qur'anen fylla ditt hjärta"

              if [ -n "${IMAM:-}" ]; then
                BODY="Kvällens Tarawih med ${IMAM} är nu uppladdad. Lyssna och reflektera över Allahs ord."
              else
                BODY="Kvällens Tarawih är nu uppladdad. Lyssna och reflektera över Allahs ord."
              fi

              if [ -n "${NATT:-}" ]; then
                URL="https://sverigesimamer.github.io/imam-schema-1448/?natt=${NATT}"
              else
                URL="https://sverigesimamer.github.io/imam-schema-1448/"
              fi
            fi

            echo "Sending push:"
            echo "Title: $TITLE"
            echo "Body:  $BODY"
            echo "URL:   $URL"

            PAYLOAD=$(jq -n \
              --arg title "$TITLE" \
              --arg body "$BODY" \
              --arg url "$URL" \
              '{title:$title, body:$body, url:$url}')

            RESPONSE=$(curl -fsSL -X POST "$PUSH_FUNCTION_URL" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD")

            echo "Response: $RESPONSE"

          done <<< "$FILES"
